<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ByteBack AI</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-shell">

  <!-- Sticky Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="status-dot" aria-hidden="true"></span>
      <h1 class="app-title">ByteBack</h1>
    </div>
    <span class="header-subtitle">Online &amp; Ready</span>
  </header>

  <!-- Chat History -->
  <main id="chat-feed" class="chat-feed" aria-live="polite">
    <div class="message ai-message">
      <div class="avatar ai-avatar"><i class='bx bxs-shield-alt-2'></i></div>
      <div class="bubble">
        Hi, I'm <strong>ByteBack AI</strong> 🛡️ — your cybersecurity assistant.
        I can help you with any assistance on cybersafety and
        and online privacy. How can i help you?
      </div>
    </div>
  </main>

  <!-- Bottom Entry Bar -->
  <footer class="entry-bar">
    <form id="chat-form" class="entry-form" autocomplete="off">
      <textarea
        id="message-input"
        class="message-input"
        placeholder="Describe your cybersecurity issue..."
        rows="1"
        maxlength="2000"
      ></textarea>
      <button type="submit" id="send-btn" class="send-btn" disabled aria-label="Send message">
        <i class='bx bx-send'></i>
      </button>
    </form>
  </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
